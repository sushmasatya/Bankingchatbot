<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Internal Assistant</title>
    <!-- Marked for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1117;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            width: 100%;
            max-width: 760px;
            padding: 40px 20px 100px 20px;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .divider {
            height: 1px;
            background-color: #262930;
            margin: 20px 0;
            border: none;
        }
        .status-box {
            background-color: #12281b;
            border: 1px solid #1a532d;
            color: #4ade80;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }
        .chat-row {
            background-color: #1a1c23;
            border: 1px solid #282b35;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            font-size: 0.95rem;
            line-height: 1.55;
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .avatar-user {
            background-color: #ef4444;
        }
        .avatar-bot {
            background-color: #f97316;
        }
        .message-content {
            flex: 1;
            color: #f3f4f6;
            word-break: break-word;
        }
        .message-content p {
            margin-bottom: 8px;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }
        .message-content ul, .message-content ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }
        .message-content strong {
            color: #ffffff;
            font-weight: 600;
        }
        .loading-text {
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Sticky Input Bar at Bottom */
        .input-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #0e1117;
            padding: 16px 20px 24px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-wrapper {
            width: 100%;
            max-width: 760px;
            display: flex;
            align-items: center;
            background-color: #1a1c23;
            border: 1px solid #2e3340;
            border-radius: 8px;
            padding: 4px 6px 4px 14px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #ef4444;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 10px 0;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #6b7280;
        }
        .send-btn {
            background-color: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background-color 0.15s;
        }
        .send-btn:hover {
            color: #ffffff;
            background-color: rgba(255,255,255,0.06);
        }
        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Banking Internal Assistant</h1>
        <p class="subtitle">Ask anything about banking policies, products, or procedures.</p>

        <hr class="divider">

        <!-- Status Banner -->
        <div class="status-box">
            <span>✅ Ready — {{NUM_CHUNKS}} document chunks indexed.</span>
        </div>

        <hr class="divider">

        <!-- Chat Messages List -->
        <div id="chatMessages" class="chat-container">
            <!-- Messages will appear here -->
        </div>
    </div>

    <!-- Pinned Bottom Input Form -->
    <div class="input-bar-container">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask a question..." 
                autocomplete="off"
            />
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'chat-row';
            row.innerHTML = `
                <div class="avatar avatar-user">🧑‍🦰</div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;
            chatMessages.appendChild(row);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function appendBotLoading() {
            const id = 'loading-' + Date.now();
            const row = document.createElement('div');
            row.id = id;
            row.className = 'chat-row';
            row.innerHTML = `
                <div class="avatar avatar-bot">🤖</div>
                <div class="message-content loading-text">
                    <span class="spinner"></span>
                    <span>Searching documents and generating answer...</span>
                </div>
            `;
            chatMessages.appendChild(row);
            window.scrollTo(0, document.body.scrollHeight);
            return id;
        }

        function updateBotMessage(id, text) {
            const row = document.getElementById(id);
            if (row) {
                const parsedHtml = marked.parse(text);
                row.innerHTML = `
                    <div class="avatar avatar-bot">🤖</div>
                    <div class="message-content">${parsedHtml}</div>
                `;
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            appendUserMessage(query);
            const loadingId = appendBotLoading();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: query })
                });

                if (!response.ok) {
                    const err = await response.text();
                    updateBotMessage(loadingId, `⚠️ **Server error (${response.status})**: ${err}`);
                } else {
                    const data = await response.json();
                    updateBotMessage(loadingId, data.answer || "No response received.");
                }
            } catch (err) {
                updateBotMessage(loadingId, "⚠️ Could not connect to the backend. Please check your network or try again in a few seconds.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        userInput.focus();
    </script>
</body>
</html>
